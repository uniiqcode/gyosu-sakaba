# main が変わった時と毎日0時過ぎに、data/recipes.json からページを作って GitHub Pages に公開する。
name: ページの公開

on:
  push:
    branches: [main]
    paths:
      - "data/recipes.json"
      - "site/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 毎日 0:05（日本時間）に作り直す。その日までに載せた品を HTML とサイトマップに書き込むため（検索対策）
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_site.py
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}   # 訪問者数を受け取るため（読むだけの権限）
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
