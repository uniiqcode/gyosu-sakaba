[official]
# 業務スーパー公式とわかる印（タイトル・チャンネル名）
title_contains = ["業務スーパーミラクルレシピ"]
title_endswith = ["｜業務スーパー", "| 業務スーパー"]
channels = ["業務スーパー", "業務スーパー公式"]
