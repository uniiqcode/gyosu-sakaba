# 集めた動画・記事を「載せるか」「どこに分けるか」決めるキーワード。
# 人が直してよい。直したら、理由を PR の説明に書く。
# 判定はタイトルと説明文（YouTube は概要欄）の文字で行う。AI は使わない。

[accept]
# どれか1つがタイトルか説明文に入っていること
gyosu = ["業務スーパー", "業スー", "業務用スーパー"]
# どれか1つが入っていること（レシピが載っている目印）
recipe = ["レシピ", "作り方", "アレンジ", "作る", "作って", "作りました", "作ってみた", "材料", "おつまみ", "簡単"]

[reject]
# タイトルにこれがあれば載せない（家庭向け・商品紹介だけのもの）
title = ["購入品", "開封", "爆買い", "店舗", "値上げ", "ランキング", "食べ比べ", "総選挙",
         "弁当", "お弁当", "献立", "離乳食", "幼児", "子ども", "子供", "おやつ", "スイーツ", "ケーキ", "パン作り",
         "ゆっくり実況"]
# このサイトからは集めない（規約で自動取得が禁止、またはレシピではない）
domains = ["cookpad.com", "fatsecret.jp", "tabelog.com", "kakaku.com", "amazon.co.jp", "rakuten.co.jp"]

[set]
# 1つの動画・記事に何品も入っているもの（「まとめて見る」へ）
patterns = ['[0-9０-９一二三四五六七八九十]+\s*(品|選|種|連発)', "使い切り", "作り置き", "つくりおき", "まとめ", "大量消費"]

# 品書きの区分。上から順に見て、最初に当たったものにする。
# 当たらなければ「未分類」になり、毎日の PR で人が決める。
[[section]]
name = "〆"
words = ["うどん", "焼きそば", "皿うどん", "そば", "ラーメン", "パスタ", "丼", "ライス", "チャーハン", "炒飯", "雑炊", "おにぎり", "炊き込み"]
[[section]]
name = "揚げ物"
words = ["唐揚", "から揚", "からあげ", "竜田", "フライ", "天ぷら", "春巻", "コロッケ", "揚げ焼き", "フリット", "カツ"]
[[section]]
name = "小鉢"
words = ["サラダ", "和え", "あえ", "漬け", "南蛮", "マリネ", "ユッケ", "ジュレ", "揚げびたし", "おひたし", "ナムル", "冷奴", "酢の物", "ディップ"]
[[section]]
name = "煮物"
words = ["煮", "おでん", "コンフィ", "鍋", "チゲ", "スープ", "アヒージョ", "シチュー"]
[[section]]
name = "炒め物"
words = ["炒め", "チャンプル", "回鍋肉", "ホイコーロー"]
[[section]]
name = "焼き物"
words = ["焼き", "焼", "ソテー", "ロースト", "炙", "グリル", "ステーキ", "つくね", "ピカタ"]

# 仕入れの札。上から順に見て、最初に当たったものにする。
[[group]]
name = "冷凍惣菜・加工品"
words = ["冷凍から揚げ", "冷凍唐揚げ", "鶏のから揚げ", "竜田揚げ", "餃子", "肉団子", "肉だんご", "煮豚", "おでん", "焼き鳥", "焼鳥",
         "春巻", "コロッケ", "白身フライ", "えびフリッター", "小籠包", "シュウマイ", "焼売", "惣菜", "スモークチキン", "中華丼の素", "ハンバーグ"]
[[group]]
name = "魚介"
words = ["赤魚", "鯖", "さば", "サバ", "いわし", "イワシ", "鮭", "サーモン", "タラ", "たら", "白身魚", "さわら", "ぶり", "ブリ",
         "えび", "エビ", "海老", "いか", "イカ", "たこ", "タコ", "カキ", "牡蠣", "かき", "あさり", "ホタテ", "帆立", "シーフード", "オイルサーディン", "ツナ"]
