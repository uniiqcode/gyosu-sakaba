# 毎日の自動収集で見に行くところ。人が足したり消したりしてよい。

[youtube]
# YouTube Data API の検索語。1回の検索で無料枠（1日10,000）のうち100を使う。
# 検索語 × 2（新しい順・関連順）回の検索をする。8語なら1,600。
queries = [
  "業務スーパー レシピ おつまみ",
  "業務スーパー アレンジ レシピ",
  "業務スーパー 冷凍 アレンジ",
  "業務スーパー 鶏肉 レシピ",
  "業務スーパー 魚 レシピ",
  "業務スーパー 居酒屋",
  "業務スーパー 調味料 レシピ",
  "業務スーパーミラクルレシピ",
]
# 何日前までの動画を探すか（見逃しを拾うため長めにする）
days = 60
max_results = 25

[rss]
# RSS / Atom のフィード。業務スーパー以外の記事も混ざるが、rules.toml で絞る。
# 試しに集めた時に業務スーパーのレシピを書いていたブログ。
feeds = [
  "https://patte-de-lapin.hatenablog.jp/rss",
  "https://ql.hatenablog.com/rss",
  "https://i-take-cooking.hateblo.jp/rss",
