  "https://rssblog.ameba.jp/noripetit/rss20.xml",
  "https://rssblog.ameba.jp/baronmamadesu/rss20.xml",
  "https://note.com/grand_arnica8909/rss",
  "https://note.com/yoko_emi/rss",
  "https://note.com/teki_kaku/rss",
  # はてなブックマークの検索（新着順）。新しいブログを見つける入口
  "https://b.hatena.ne.jp/q/%E6%A5%AD%E5%8B%99%E3%82%B9%E3%83%BC%E3%83%91%E3%83%BC%20%E3%83%AC%E3%82%B7%E3%83%94?mode=rss&sort=recent",
